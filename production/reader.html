<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader | Rajgruha</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="reader" data-breadcrumb="Home > Catalog|e_commerce.html > Reader">

<main class="main">
<div class="reader-page">

  <div class="reader-stage">
    <div id="pdf-viewer"></div>
    <div class="reader-loading" id="reader-loading">
      <span class="reader-spinner" aria-hidden="true"></span>
      Loading the demo PDF…
    </div>
  </div>

</div>
</main>

<script type="module">
async function mountReader() {
  const target = document.getElementById('pdf-viewer');
  const loading = document.getElementById('reader-loading');
  try {
    const { default: EmbedPDF } = await import('https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js');
    await EmbedPDF.init({
      type: 'container',
      target,
      src: 'https://snippet.embedpdf.com/ebook.pdf',
      theme: { preference: 'system' }
    });
    loading.remove();
  } catch (err) {
    loading.textContent = 'The demo PDF could not load. Check your connection and reload.';
  }
}
mountReader();
</script>

</body>
</html>
