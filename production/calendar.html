<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading calendar | Rajgruha</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="calendar" data-breadcrumb="Home > Reading calendar">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Reading</div>
        <h1 class="page-title">Reading calendar</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h8M8 4v8"/></svg>
          New event
        </button>
      </div>
    </div>
  </div>

  <div class="card calendar-card">
    <div class="calendar-toolbar">
      <button class="btn btn-outline btn-sm" id="cal-today" type="button">Today</button>
      <div class="nav-btns">
        <button class="card-opt-btn" id="cal-prev" type="button" aria-label="Previous">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3L5 7l4 4"/></svg>
        </button>
        <button class="card-opt-btn" id="cal-next" type="button" aria-label="Next">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
        </button>
      </div>
      <div class="calendar-month">November 2026</div>
      <div class="spacer"></div>
      <div class="chart-tabs calendar-views" role="tablist" aria-label="Calendar view">
        <button class="chart-tab active" type="button" role="tab" data-view="month" aria-selected="true">Month</button>
        <button class="chart-tab" type="button" role="tab" data-view="week" aria-selected="false">Week</button>
        <button class="chart-tab" type="button" role="tab" data-view="day" aria-selected="false">Day</button>
      </div>
    </div>

    <div class="calendar-body" data-view="month"></div>
  </div>

</div>
</main>

</body>
</html>
