<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections | Rajgruha</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="projects" data-breadcrumb="Home > Collections">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Curated shelves</div>
        <h1 class="page-title">Collections</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline">Filters</button>
        <button class="btn btn-primary">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h8M8 4v8"/></svg>
          New collection
        </button>
      </div>
    </div>
  </div>

  <div class="row col-3" id="projects-grid"></div>

</div>
</main>

<script type="module">
const collections = [
  ['Sci-fi classics',        'Curated by Maya',   'Published',  'green',  'The genre-defining novels every reader should start with, from Le Guin to Liu Cixin.', 78, 'Nov 01', ['SK','MR','EW']],
  ['Book club 2026',         'Reading group',     'Active',     'green',  'Twelve titles, one a month, chosen by the Wednesday night book club.', 42, 'Oct 28', ['MK','LP','DR','YT']],
  ['Staff picks',            'Curated by Aigars', 'Active',     'green',  'What the librarians are reading right now — refreshed every Friday.', 91, 'Nov 03', ['TH','MR']],
  ['South Asian voices',     'Curated by Lina',   'Growing',    'yellow', 'Contemporary fiction and essays from writers across the subcontinent.', 33, 'Oct 30', ['LP','EW','SK']],
  ['Rare & fragile',         'Archive room',      'Restricted', 'red',    'First editions and out-of-print titles. Reading-room access only.', 18, 'Oct 12', ['DR','MK']],
  ['Audiobook essentials',   'Curated by Maya',   'Published',  'green',  'Narrator-led picks that are better heard than read.', 64, 'Nov 02', ['SK','EW','LP','TH']],
  ['Beginner philosophy',    'Reading group',     'Paused',      'yellow', 'Short, accessible entry points into the big questions.', 5, 'Sep 30', ['YT','MR']],
  ['Nature & climate',       'Curated by Tom',    'Active',     'green',  'Field writing, climate reporting, and the more-than-human world.', 72, 'Nov 01', ['DR','TH']],
  ['Short reads under 200pp','Curated by Emily',  'Active',     'green',  'For the commute, the lunch break, and the reading slump.', 50, 'Oct 26', ['LP','MK']]
];
const colorMap = { primary:'var(--primary)', azure:'var(--azure)', purple:'var(--purple)', yellow:'var(--yellow)', red:'var(--red)', green:'var(--green)', blue:'var(--blue)' };
const memberColors = { SK:'azure', MR:'purple', EW:'yellow', MK:'red', LP:'green', DR:'blue', YT:'primary', TH:'purple' };
const statusCls = { green:'status-green', yellow:'status-yellow', red:'status-red' };

const grid = document.getElementById('projects-grid');
grid.innerHTML = collections.map(([title, curator, status, sCls, desc, pct, updated, members]) => `
  <a class="project-card" href="project_detail.html" style="text-decoration:none;color:inherit">
    <div class="top">
      <div>
        <div class="title">${title}</div>
        <div class="client">${curator}</div>
      </div>
      <span class="status ${statusCls[sCls]}">${status}</span>
    </div>
    <div class="desc">${desc}</div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-bottom:4px">
        <span>Catalogued</span><span class="cell-strong">${pct}%</span>
      </div>
      <div class="progress-thin"><div class="bar" style="width:${pct}%;background:var(--${sCls === 'red' ? 'red' : sCls === 'yellow' ? 'yellow' : 'primary'})"></div></div>
    </div>
    <div class="footer-row">
      <div class="avatars">
        ${members.map((m) => `<div class="av" style="background:${colorMap[memberColors[m] || 'primary']}">${m}</div>`).join('')}
      </div>
      <span>Updated ${updated}</span>
    </div>
  </a>
`).join('');
</script>

</body>
</html>
