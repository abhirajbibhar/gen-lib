<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover gallery | Rajgruha</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="media" data-breadcrumb="Home > Cover gallery">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Catalog art</div>
        <h1 class="page-title">Cover gallery</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline">Filter</button>
        <button class="btn btn-primary">Upload cover</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body" style="padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text-muted)">1,842 covers · 24 missing · last refresh 2 hours ago</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">Grid</span>
      <div class="chart-tabs">
        <button class="chart-tab active">All</button>
        <button class="chart-tab">Recent</button>
        <button class="chart-tab">Missing</button>
      </div>
    </div>
  </div>

  <div class="book-shelf" id="cover-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>

</div>
</main>

<script type="module">
const covers = [
  ['The Left Hand of Darkness','Ursula K. Le Guin','left-hand-of-darkness','Ace Books','EPUB · PDF'],
  ['Piranesi','Susanna Clarke','piranesi','Bloomsbury','EPUB'],
  ['Braiding Sweetgrass','Robin Wall Kimmerer','braiding-sweetgrass','Milkweed','EPUB · PDF'],
  ['Klara and the Sun','Kazuo Ishiguro','klara-and-the-sun','Faber','EPUB · Audio'],
  ['The Overstory','Richard Powers','the-overstory','Norton','EPUB'],
  ['Project Hail Mary','Andy Weir','project-hail-mary','Ballantine','EPUB · PDF · Audio'],
  ['Circe','Madeline Miller','circe','Little, Brown','EPUB · Audio'],
  ['The Master and Margarita','Mikhail Bulgakov','the-master-and-margarita','Vintage Classics','EPUB · PDF'],
  ['Sapiens','Yuval Noah Harari','sapiens','Harper','PDF · EPUB'],
  ['The Ministry for the Future','Kim Stanley Robinson','the-ministry-for-the-future','Orbit','EPUB'],
  ['Educated','Tara Westover','educated','Random House','EPUB · Audio'],
  ['The Name of the Wind','Patrick Rothfuss','the-name-of-the-wind','DAW Books','EPUB · PDF']
];

document.getElementById('cover-grid').innerHTML = covers.map(([title, author, slug, publisher, formats]) => `
  <div class="book-card">
    <img class="book-cover" src="../images/covers/${slug}.svg" alt="Cover of ${title} by ${author}" width="480" height="720" loading="lazy" decoding="async">
    <div class="book-title">${title}</div>
    <div class="book-author">${author}</div>
    <div class="book-badges"><span class="format-tag epub">${formats}</span></div>
  </div>
`).join('');
</script>

</body>
</html>
