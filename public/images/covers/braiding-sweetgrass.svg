<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="Braiding Sweetgrass by Robin Wall Kimmerer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#37795c"/>
      <stop offset="1" stop-color="#0d2a21"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#e2f0e6">
    <g stroke="currentColor" fill="none" opacity=".34">
      <path d="M240 690 C240 520 236 420 214 320 C260 380 276 470 262 560" stroke-width="1.3"/>
      <path d="M240 560 C190 540 150 500 132 452 C186 462 224 500 240 560 Z" stroke-width="1.1"/>
      <path d="M250 500 C300 486 340 450 356 404 C304 414 266 450 250 500 Z" stroke-width="1.1"/>
      <path d="M238 470 C196 462 160 430 144 392 C188 400 222 428 238 470 Z" stroke-width=".9" opacity=".8"/>
      <path d="M248 420 C290 412 322 384 336 352 C296 358 266 382 248 420 Z" stroke-width=".9" opacity=".8"/>
      <path d="M214 320 q26 -44 10 -96" stroke-width="1"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#e2f0e6" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#e2f0e6" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">MILKWEED EDITIONS</text>

  <text fill="#e2f0e6" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">Braiding</tspan><tspan x="52" y="326.68">Sweetgrass</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#e2f0e6" fill-opacity=".65"/>

  <text x="52" y="652" fill="#e2f0e6" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">ROBIN WALL KIMMERER</text>
