<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="The Three-Body Problem by Liu Cixin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#a23c17"/>
      <stop offset="1" stop-color="#2c0d03"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#ffe9dd">
    <g stroke="currentColor" fill="none" opacity=".36">
      <ellipse cx="240" cy="380" rx="190" ry="62" transform="rotate(-18 240 380)" stroke-width="1"/>
      <ellipse cx="240" cy="380" rx="150" ry="150" stroke-width=".8" opacity=".6"/>
      <circle cx="240" cy="380" r="62" fill="currentColor" opacity=".5" stroke="none"/>
      <circle cx="386" cy="316" r="9" fill="currentColor" stroke="none"/>
      <circle cx="96" cy="446" r="5" fill="currentColor" stroke="none"/>
      <path d="M0 660 L480 560" stroke-width=".8" opacity=".5"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#ffe9dd" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#ffe9dd" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">TOR</text>

  <text fill="#ffe9dd" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">The Three-Body</tspan><tspan x="52" y="326.68">Problem</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#ffe9dd" fill-opacity=".65"/>

  <text x="52" y="652" fill="#ffe9dd" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">LIU CIXIN</text>
</svg>
