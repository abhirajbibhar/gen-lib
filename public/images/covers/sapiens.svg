<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="Sapiens by Yuval Noah Harari">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#b1441c"/>
      <stop offset="1" stop-color="#3a1204"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#fdece4">
    <g stroke="currentColor" fill="none" opacity=".26">
      <path d="M0 120 h480 M0 180 h480 M0 240 h480 M0 300 h480 M0 360 h480 M0 420 h480 M0 480 h480 M0 540 h480 M0 600 h480 M0 660 h480" stroke-width=".7"/>
      <path d="M60 80 v640 M120 80 v640 M180 80 v640 M240 80 v640 M300 80 v640 M360 80 v640 M420 80 v640" stroke-width=".7"/>
      <circle cx="240" cy="300" r="64" fill="currentColor" opacity=".55" stroke="none"/>
      <path d="M120 600 h240" stroke-width="2"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#fdece4" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#fdece4" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">HARPER</text>

  <text fill="#fdece4" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="300">Sapiens</tspan></text>

  <rect x="52" y="334" width="42" height="2" fill="#fdece4" fill-opacity=".65"/>

  <text x="52" y="652" fill="#fdece4" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">YUVAL NOAH HARARI</text>
</svg>
