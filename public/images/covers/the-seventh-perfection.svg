<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="The Seventh Perfection by Daniel Polansky">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3f3a7a"/>
      <stop offset="1" stop-color="#100e26"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#e6e3ff">
    <g stroke="currentColor" fill="none" opacity=".3">
      <circle cx="240" cy="380" r="118" stroke-width="1.4"/>
      <circle cx="240" cy="380" r="158" stroke-width="1"/>
      <circle cx="240" cy="380" r="198" stroke-width=".8"/>
      <circle cx="240" cy="380" r="238" stroke-width=".6"/>
      <circle cx="286" cy="330" r="46" stroke-width="1.6"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#e6e3ff" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#e6e3ff" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">TOR</text>

  <text fill="#e6e3ff" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">The Seventh</tspan><tspan x="52" y="326.68">Perfection</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#e6e3ff" fill-opacity=".65"/>

  <text x="52" y="652" fill="#e6e3ff" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">DANIEL POLANSKY</text>
</svg>
