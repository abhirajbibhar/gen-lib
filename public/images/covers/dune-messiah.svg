<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="Dune Messiah by Frank Herbert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#b98a4b"/>
      <stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#fff3dd">
    <g opacity=".38">
      <circle cx="240" cy="352" r="96" fill="currentColor" opacity=".55"/>
      <g stroke="currentColor" fill="none" stroke-width="1">
        <path d="M40 448 h400"/>
        <path d="M40 470 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0" opacity=".7"/>
        <path d="M40 500 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0" opacity=".5"/>
        <path d="M40 530 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0" opacity=".32"/>
        <path d="M40 560 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0" opacity=".2"/>
      </g>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#fff3dd" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#fff3dd" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">DEL REY</text>

  <text fill="#fff3dd" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">Dune</tspan><tspan x="52" y="326.68">Messiah</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#fff3dd" fill-opacity=".65"/>

  <text x="52" y="652" fill="#fff3dd" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">FRANK HERBERT</text>
</svg>
