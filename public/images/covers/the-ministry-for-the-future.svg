<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="The Ministry for the Future by Kim Stanley Robinson">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#14897f"/>
      <stop offset="1" stop-color="#02241f"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#dff7f3">
    <g stroke="currentColor" fill="none" opacity=".34">
      <path d="M-20 250 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width="1.2"/>
      <path d="M-20 300 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width="1"/>
      <path d="M-20 350 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width=".9" opacity=".8"/>
      <path d="M-20 470 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width="1.4"/>
      <path d="M-20 520 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width="1"/>
      <path d="M-20 570 q60 -46 120 0 t120 0 t120 0 t120 0 t120 0" stroke-width=".8" opacity=".7"/>
      <circle cx="360" cy="176" r="52" fill="currentColor" opacity=".5" stroke="none"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#dff7f3" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#dff7f3" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">ORBIT</text>

  <text fill="#dff7f3" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">The Ministry</tspan><tspan x="52" y="326.68">for the Future</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#dff7f3" fill-opacity=".65"/>

  <text x="52" y="652" fill="#dff7f3" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">KIM STANLEY ROBINSON</text>
</svg>
