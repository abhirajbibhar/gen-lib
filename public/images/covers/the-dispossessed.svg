<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-label="The Dispossessed by Ursula K. Le Guin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b5384"/>
      <stop offset="1" stop-color="#091624"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#bg)"/>
  <g color="#e3edfa">
    <g stroke="currentColor" fill="none" opacity=".34">
      <path d="M80 700 V360 a160 160 0 0 1 320 0 V700" stroke-width="1.4"/>
      <path d="M120 700 V380 a120 120 0 0 1 240 0 V700" stroke-width="1.1" opacity=".85"/>
      <path d="M160 700 V400 a80 80 0 0 1 160 0 V700" stroke-width=".9" opacity=".7"/>
      <path d="M200 700 V420 a40 40 0 0 1 80 0 V700" stroke-width="1.6"/>
      <path d="M0 700 h480" stroke-width="1"/>
    </g></g>
  <rect width="480" height="720" fill="url(#fade)"/>
  <rect width="480" height="720" fill="url(#sheen)"/>
  <rect width="16" height="720" fill="url(#spine)"/>
  <rect x="1" y="1" width="478" height="718" fill="none" stroke="#e3edfa" stroke-opacity=".28"/>

  <text x="52" y="72" fill="#e3edfa" fill-opacity=".72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">HARPER PERENNIAL</text>

  <text fill="#e3edfa" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6"><tspan x="52" y="273.32">The</tspan><tspan x="52" y="326.68">Dispossessed</tspan></text>

  <rect x="52" y="360.68" width="42" height="2" fill="#e3edfa" fill-opacity=".65"/>

  <text x="52" y="652" fill="#e3edfa" fill-opacity=".9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="1.6">URSULA K. LE GUIN</text>
</svg>
